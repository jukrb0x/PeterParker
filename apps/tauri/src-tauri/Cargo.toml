[package]
name = "peterparker-tauri"
version = "0.1.0"
description = "PeterParker Tauri Desktop App"
authors = ["Jabriel <jabrielah@outlook.com>"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

peterparker-core = { path = "../../../packages/core" }

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]
