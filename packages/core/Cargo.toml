[package]
name = "peterparker-core"
version = "0.1.0"
description = "PeterParker core network scanning library"
authors = ["Jabriel <jabrielah@outlook.com>"]
edition = "2021"
rust-version = "1.75"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
